<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>假名怪兽图鉴</title>
<meta name="description" content="听声音打假名怪兽，收集 92 只怪兽，开口说日语打 BOSS。">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--sky:#7ec8ff;--sky2:#c9ecff;--grass:#5cc15a;--grass2:#3d9a3f;--ink:#1d1b2e;--card:#fffaf0;--red:#ff4d5e;--yel:#ffd23f;--blue:#2f6bff;--sub:#6d6a7c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--ink);font-family:"DotGothic16","PingFang SC",monospace;min-height:100vh;overflow-x:hidden}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:linear-gradient(var(--sky) 0,var(--sky2) 100%);position:relative;padding:14px 16px 30px}
.px{image-rendering:pixelated}
.box{background:var(--card);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px}
.btn{display:block;width:100%;border:4px solid var(--ink);background:var(--yel);box-shadow:4px 4px 0 var(--ink);padding:12px;font:inherit;font-size:19px;cursor:pointer;color:var(--ink);margin-top:12px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}.btn.w{background:var(--card)}.btn.blue{background:var(--blue);color:#fff}
.hdr{display:flex;gap:8px;align-items:center;font-size:16px}
.hdr .pill{background:var(--card);border:3px solid var(--ink);padding:3px 8px}
h1{font-size:38px;line-height:1.05;text-align:center;color:#fff;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);margin:14px 0 4px}
h1 b{color:var(--yel);font-weight:400}
.tag{text-align:center;font-size:15px;color:var(--ink);margin-bottom:10px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.st{background:var(--card);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);text-align:center;padding:6px 0 4px;cursor:pointer;font-size:20px;position:relative}
.st small{display:block;font-size:11px;color:#c99a00;letter-spacing:-1px;min-height:13px}
.st.lk{background:#cfcbd8;color:#7b7790}.st.lk:after{content:"🔒";position:absolute;top:-8px;right:-6px;font-size:14px}
.sec{font-size:15px;margin-top:14px;color:var(--ink);background:rgba(255,255,255,.6);display:inline-block;padding:2px 8px;border:2px solid var(--ink)}
.rev{background:#3b1d4f;color:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px;margin-top:12px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:16px}

.arena{position:relative;height:330px;margin-top:10px;border:4px solid var(--ink);background:linear-gradient(#9fd8ff 0,#d8f1ff 55%,#7bd36f 55%,#5cc15a 100%);overflow:hidden}
.lane{position:absolute;left:0;right:0;height:1px}
.hero{position:absolute;left:6px;bottom:90px;width:56px}
.mon{position:absolute;width:86px;cursor:pointer;transition:filter .1s;touch-action:manipulation}
.mon img{width:86px;display:block}
.mon .k{position:absolute;left:50%;top:74%;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--ink);font-size:22px;min-width:34px;text-align:center;line-height:30px;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-weight:800}
.mon.hit{animation:pop .35s forwards}.mon.no{animation:shake .3s}.mon.bye{opacity:0;transition:opacity .4s}
@keyframes pop{0%{filter:brightness(4)}100%{transform:scale(1.6);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.float{position:absolute;font-size:22px;color:var(--yel);text-shadow:2px 2px 0 var(--ink);pointer-events:none;animation:up .8s forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.prompt{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.prompt .box{flex:1;font-size:18px;padding:8px 10px}
.ear{border:4px solid var(--ink);background:var(--blue);color:#fff;font:inherit;font-size:22px;width:58px;height:50px;margin-left:8px;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.combo{position:absolute;right:8px;top:6px;font-size:22px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.wave{position:absolute;left:8px;top:6px;font-size:15px;background:var(--card);border:3px solid var(--ink);padding:1px 6px}
/* BOSS */
.boss{text-align:center;margin-top:8px}
.boss img{width:170px;animation:bob 1.2s infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.boss.dmg img{animation:dmg .3s}@keyframes dmg{0%{filter:brightness(4)}50%{transform:translateX(10px)}}
.hp{height:18px;border:3px solid var(--ink);background:#fff;margin:6px auto;width:80%;display:flex}
.hp i{flex:1;background:var(--red);border-right:2px solid var(--ink)}.hp i.off{background:#ddd}
.slots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.slot{width:46px;height:52px;border:3px dashed var(--ink);background:rgba(255,255,255,.7);font-size:28px;line-height:46px;font-family:"Hiragino Maru Gothic ProN",sans-serif;font-weight:800}
.slot.on{border-style:solid;background:var(--yel)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tile{border:4px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--ink);font-size:28px;padding:8px 0;cursor:pointer;font-family:"Hiragino Maru Gothic ProN",sans-serif;font-weight:800;color:var(--ink)}
.tile.used{visibility:hidden}.tile.no{background:#ffb3b3;animation:shake .3s}
.tbar{height:10px;border:3px solid var(--ink);background:#fff;margin-top:10px}.tbar i{display:block;height:100%;background:var(--blue)}
.mic{background:var(--red);color:#fff}.mic.on{animation:pulse 1s infinite}@keyframes pulse{50%{background:#ff8a96}}
/* 图鉴 */
.dex{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.dx{background:var(--card);border:3px solid var(--ink);text-align:center;padding:4px 0;font-size:13px}
.dx img{width:44px;display:block;margin:0 auto}.dx.no img{filter:brightness(0) opacity(.35)}
.dx b{font-family:"Hiragino Maru Gothic ProN",sans-serif;font-size:16px}
.center{text-align:center}.big{font-size:56px}.muted{color:var(--sub);font-size:14px;line-height:1.5}
input.code{width:100%;border:4px solid var(--ink);padding:12px;font:inherit;font-size:20px;text-align:center;margin-top:12px;text-transform:uppercase}
.hearts{letter-spacing:2px}

const monImg=(ch,kind,row)=>sprite('m'+ch,PAL[kind][(row*3+ch.charCodeAt(0))%10],12);

function heroImg(){if(cache.hero)return cache.hero;const c=document.createElement('canvas');c.width=10;c.height=12;const x=c.getContext('2d'),C={k:'#1d1b2e',y:'#ff4d5e',f:'#ffd8b5',b:'#2f6bff'};
HERO.forEach((r,y)=>[...r].forEach((v,i)=>{if(C[v]){x.fillStyle=C[v];x.fillRect(i,y,1,1)}}));return cache.hero=c.toDataURL()}
// ---------- 工具 ----------
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const k2h=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
const rowOf=ch=>S.findIndex(s=>s.kana.some(k=>k.c===ch));
const kanaInfo=ch=>{for(const s of S)for(const k of s.kana)if(k.c===ch)return Object.assign({kind:s.kind,row:+s.id.slice(1)},k)};
const locked=i=>i>=FREE&&!sv.un;
const hearts=n=>'❤️'.repeat(n)+'🖤'.repeat(Math.max(0,3-n));
let G=null,raf=0;
// ---------- 首页 ----------
function home(){cancelAnimationFrame(raf);G=null;const got=Object.keys(sv.dex).length;
const revN=Object.entries(sv.miss).filter(([c,d])=>d<today()).length;
const node=(s,i)=>`<div class="st ${locked(i)?'lk':''}" onclick="enter(${i})">${s.kana[0].c}<small>${'★'.repeat(sv.stars[s.id]||0)}</small></div>`;
app.innerHTML=`<div class="hdr"><span class="pill">🪙 ${sv.coins}</span><span class="pill" onclick="dex()" style="cursor:pointer">📖 图鉴 ${got}/92</span></div>
<h1>假名<b>怪兽</b><br>图鉴</h1><div class="tag">听声音，打怪兽，收集 92 只假名怪兽</div>
${revN?`<div class="rev" onclick="revenge()"><span style="font-size:32px">😈</span><span>复仇怪来袭！<br><small>昨天放跑的 ${revN} 只又回来了</small></span></div>`:''}
<div class="sec">🌸 平假名之森</div><div class="map">${S.slice(0,10).map((s,i)=>node(s,i)).join('')}</div>
<div class="sec">⚡ 片假名之城</div><div class="map">${S.slice(10).map((s,i)=>node(s,i+10)).join('')}</div>
<div class="box" style="margin-top:14px;font-size:14px;line-height:1.6">🎮 玩法：怪兽冲过来时会喊出一个假名，<b>听声音点中对的那只</b>。<br>👑 每关最后有 BOSS，要拼对一个日语单词才能打败，${(window.SpeechRecognition||window.webkitSpeechRecognition)?'也可以🎤<b>开口说</b>直接秒杀。':'换 Safari/Chrome 打开还能🎤开口说秒杀。'}<br>😈 放跑的怪兽第二天会回来复仇。</div>
${sv.un?'':`<button class="btn w" onclick="lock()">🔑 输入兑换码，解锁全部 20 关</button><div class="muted center" style="margin-top:6px">あ・か・さ 三行免费玩</div>`}`}
function enter(i){if(locked(i))return lock();start(S[i],false)}
function revenge(){const pool=Object.entries(sv.miss).filter(([c,d])=>d<today()).map(([c])=>kanaInfo(c)).filter(Boolean);
if(!pool.length)return home();start({id:'rev',name:'复仇怪',kind:'h',kana:pool,boss:[]},true)}
// ---------- 打怪 ----------
function start(st,rev){const pool=st.kana.slice(),idx=S.indexOf(st);
const prev=idx>0?S.slice(st.kind==='h'?0:10,idx).flatMap(s=>s.kana):[];
G={st,rev,idx,pool,prev,seq:[],wave:0,hp:3,combo:0,best:0,coins:0,caught:new Set(),mons:[],waves:rev?Math.min(12,pool.length*2):WAVES};
app.innerHTML=`<div class="hdr"><span class="pill" onclick="home()" style="cursor:pointer">✖</span><span class="pill">${st.name}</span><span class="pill hearts" id="hp">${hearts(3)}</span><span class="pill">🪙 <span id="cn">0</span></span></div>
<div class="arena" id="ar"><div class="wave" id="wv"></div><div class="combo" id="cb"></div><img class="hero px" src="${heroImg()}"></div>
<div class="prompt"><div class="box" id="pm">🔊 听！是哪一只？</div><button class="ear" onclick="G&&G.t&&play(G.t.a)">🔊</button></div>
<div class="muted center" style="margin-top:8px">点中刚才喊出声音的怪兽 · 别让它碰到你</div>`;
setTimeout(nextWave,600)}
function nextWave(){if(!G)return;if(G.wave>=G.waves)return G.st.boss.length?bossIntro():finish(true);G.wave++;
const ar=$('ar');G.mons.forEach(m=>m.el.remove());G.mons=[];
if(!G.seq.length)G.seq=shuffle(G.pool);const t=G.seq.pop();let others=shuffle([...G.pool,...(G.prev.length?shuffle(G.prev).slice(0,3):[])].filter(k=>k.c!==t.c)).slice(0,2);
while(others.length<2)others.push(pick(S[0].kana.filter(k=>k.c!==t.c&&!others.includes(k))));
G.t=t;const set=shuffle([t,...others]),speed=(9-Math.min(4,G.wave*.4+(G.idx%10)*.15))*1000;
set.forEach((k,lane)=>{const ki=kanaInfo(k.c)||{kind:'h',row:0},el=document.createElement('div');el.className='mon';
el.innerHTML=`<img class="px" src="${monImg(k.c,ki.kind,ki.row)}"><span class="k">${k.c}</span>`;el.style.top=(18+lane*100)+'px';
el.onpointerdown=e=>{e.preventDefault();tap(m)};ar.appendChild(el);
const m={k,el,x:ar.clientWidth+lane*40,dead:false,v:(ar.clientWidth+40)/speed};G.mons.push(m)});
$('wv').textContent=`第 ${G.wave}/${G.waves} 波`;$('pm').innerHTML='🔊 听！是哪一只？';play(t.a);
let last=performance.now();cancelAnimationFrame(raf);
const step=now=>{if(!G)return;const dt=now-last;last=now;let lose=false;
for(const m of G.mons){if(m.dead)continue;m.x-=m.v*dt;m.el.style.left=m.x+'px';if(m.k===G.t&&m.x<58)lose=true}
if(lose)return hurt();raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
function tap(m){if(!G||m.dead)return;const ar=$('ar');
if(m.k===G.t){m.dead=true;m.el.classList.add('hit');SFX.hit();G.combo++;G.best=Math.max(G.best,G.combo);const c=5+Math.min(G.combo,10);G.coins+=c;
G.caught.add(m.k.c);if(G.rev)delete sv.miss[m.k.c];
floatTxt(ar,m.x+20,parseInt(m.el.style.top),`+${c}`);$('cn').textContent=G.coins;$('cb').textContent=G.combo>1?`${G.combo} 连击!`:'';
$('pm').innerHTML=`✅ <b style="font-family:sans-serif">${m.k.c}</b> = ${m.k.r}`;
G.mons.forEach(o=>{if(!o.dead){o.dead=true;o.el.classList.add('bye')}});cancelAnimationFrame(raf);setTimeout(nextWave,750)}
else{m.el.classList.remove('no');void m.el.offsetWidth;m.el.classList.add('no');SFX.no();G.combo=0;$('cb').textContent='';
$('pm').innerHTML=`❌ 这只是 <b style="font-family:sans-serif">${m.k.c}</b>（${m.k.r}），再听一次`;play(G.t.a);G.mons.forEach(o=>{if(o.k===G.t)o.x-=0;else o.v*=1});m.x+=0}}
function hurt(){cancelAnimationFrame(raf);const ar=$('ar');ar.classList.remove('hurt');void ar.offsetWidth;ar.classList.add('hurt');SFX.hurt();
G.hp--;G.combo=0;$('hp').textContent=hearts(G.hp);sv.miss[G.t.c]=today();save();
$('pm').innerHTML=`💥 被撞了！刚才是 <b style="font-family:sans-serif">${G.t.c}</b>（${G.t.r}）`;
G.mons.forEach(o=>{o.dead=true;o.el.classList.add('bye')});setTimeout(()=>G.hp<=0?finish(false):nextWave(),1300)}
function floatTxt(ar,x,y,t){const f=document.createElement('div');f.className='float';f.style.left=x+'px';f.style.top=y+'px';f.textContent=t;ar.appendChild(f);setTimeout(()=>f.remove(),800)}
// ---------- BOSS ----------
function bossIntro(){const b=pick(G.st.boss);G.b=b;G.got=0;const chars=[...b.w];
const extra=shuffle([...G.pool,...G.prev].map(k=>k.c).filter(c=>!chars.includes(c))).slice(0,Math.max(2,8-chars.length));
G.tiles=shuffle([...chars,...extra]);SFX.boss();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
app.innerHTML=`<div class="hdr"><span class="pill">${G.st.name} BOSS</span><span class="pill hearts" id="hp">${hearts(G.hp)}</span><span class="pill">🪙 <span id="cn">${G.coins}</span></span></div>
<div class="boss" id="bs"><img class="px" src="${sprite('B'+b.w,PAL[G.st.kind][(G.idx+3)%10],16)}">
<div class="hp" id="bh">${chars.map(()=>'<i></i>').join('')}</div>
<div class="box" style="display:inline-block;font-size:18px">${b.em} 「${b.zh}」用日语怎么说？ <button class="ear" style="width:44px;height:38px;font-size:17px" onclick="play('${b.a}')">🔊</button></div></div>
<div class="slots" id="sl">${chars.map(()=>'<div class="slot"></div>').join('')}</div>
<div class="tbar"><i id="tb" style="width:100%"></i></div>
<div class="tiles" id="tl">${G.tiles.map((c,i)=>`<button class="tile" id="t${i}" onclick="tile(${i})">${c}</button>`).join('')}</div>
${SR?'<button class="btn mic" id="mic" onclick="listen()">🎤 开口说出来，直接秒杀！</button>':''}
<div class="muted center" id="bm" style="margin-top:8px">按顺序点假名，拼出这个词</div>`;
setTimeout(()=>play(b.a),500);const T=25000,t0=Date.now();clearInterval(G.tm);
G.tm=setInterval(()=>{const l=1-(Date.now()-t0)/T;$('tb').style.width=Math.max(0,l*100)+'%';if(l<=0){clearInterval(G.tm);bossHit()}},100)}
function tile(i){if(!G||!G.b)return;const c=G.tiles[i],need=[...G.b.w][G.got],el=$('t'+i);
if(c===need){el.classList.add('used');const s=$('sl').children[G.got];s.textContent=c;s.classList.add('on');$('bh').children[G.got].classList.add('off');G.got++;SFX.hit();
const bs=$('bs');bs.classList.remove('dmg');void bs.offsetWidth;bs.classList.add('dmg');if(G.got===[...G.b.w].length)bossDown(false)}
else{el.classList.remove('no');void el.offsetWidth;el.classList.add('no');SFX.no();$('bm').textContent=`不对，第 ${G.got+1} 个音是？点🔊再听一遍`}}
function bossHit(){if(!G)return;G.hp--;SFX.hurt();$('hp').textContent=hearts(G.hp);
const ar=$('bs');ar.classList.add('dmg');$('bm').innerHTML=`⏰ 时间到！BOSS 反击。答案是 <b style="font-family:sans-serif;font-size:20px">${G.b.w}</b>`;
$('sl').innerHTML=[...G.b.w].map(c=>`<div class="slot on">${c}</div>`).join('');play(G.b.a);setTimeout(()=>G.hp<=0?finish(false):finish(true,true),2200)}
function bossDown(voice){clearInterval(G.tm);SFX.win();const bonus=voice?60:30;G.coins+=bonus;G.bossWin=voice?'voice':'tap';
$('bm').innerHTML=voice?`🎤 说对了！BOSS 秒杀 +${bonus}🪙`:`🎉 打败 BOSS！+${bonus}🪙`;$('cn').textContent=G.coins;
$('sl').innerHTML=[...G.b.w].map(c=>`<div class="slot on">${c}</div>`).join('');play(G.b.a);
$('bs').querySelector('img').style.animation='pop .8s forwards';setTimeout(()=>finish(true),1600)}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;const r=new SR();r.lang='ja-JP';r.interimResults=false;r.maxAlternatives=5;
const btn=$('mic');btn.classList.add('on');btn.textContent='🎤 请说…';
r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript.replace(/[\s。、！？]/g,''));const w=k2h(G.b.w).replace(/ー/g,''),kj=G.b.kj.toLowerCase();
const okv=alts.some(a=>{const h=k2h(a).replace(/ー/g,'').toLowerCase();return h.includes(w)||a.toLowerCase().includes(kj)||h.includes(k2h(kj))});
if(okv)bossDown(true);else{SFX.no();btn.classList.remove('on');btn.textContent='🎤 再说一次';$('bm').textContent=`听到的是「${alts[0]||'…'}」，再试一次，或者点假名拼出来`}};
r.onerror=()=>{btn.classList.remove('on');btn.textContent='🎤 没听清，再说一次';$('bm').textContent='这个浏览器可能不支持语音，点假名拼出来也可以'};
r.onend=()=>{btn.classList.remove('on');if(btn.textContent==='🎤 请说…')btn.textContent='🎤 再说一次'};try{r.start()}catch(e){}}
// ---------- 结算 ----------
function finish(win,timeout){cancelAnimationFrame(raf);clearInterval(G&&G.tm);const st=G.st;const fresh=[...G.caught].filter(c=>!sv.dex[c]);
G.caught.forEach(c=>sv.dex[c]=1);sv.coins+=G.coins;const star=win?Math.max(1,G.hp):0;if(st.id!=='rev'&&star>(sv.stars[st.id]||0))sv.stars[st.id]=star;save();
const next=G.idx>=0&&G.idx<S.length-1?G.idx+1:-1;SFX.coin();
app.innerHTML=`<h1>${win?'通关！':'失败了…'}</h1><div class="box center">
<div class="big">${win?'★'.repeat(star)+'☆'.repeat(3-star):'💀'}</div>
<div style="font-size:18px;margin-top:6px">🪙 +${G.coins} · 最高 ${G.best} 连击</div>
${fresh.length?`<div style="margin-top:12px;font-size:16px">📖 新收服 ${fresh.length} 只怪兽！</div><div class="dex">${fresh.map(c=>{const k=kanaInfo(c);return`<div class="dx"><img class="px" src="${monImg(c,k.kind,k.row)}"><b>${c}</b><br>${k.r}</div>`}).join('')}</div>`:''}
${!win?`<div class="muted" style="margin-top:10px">被撞到的怪兽明天会回来复仇 😈</div>`:''}</div>
${win&&next>=0&&st.id!=='rev'?`<button class="btn" onclick="enter(${next})">下一关：${S[next].name} ➜</button>`:''}
<button class="btn w" onclick="${st.id==='rev'?'revenge()':`enter(${Math.max(0,G.idx)})`}">再打一次 🔁</button>
<button class="btn w" onclick="home()">回到地图</button>`;G=null}
// ---------- 图鉴 ----------
function dex(){const all=S.flatMap(s=>s.kana.map(k=>Object.assign({kind:s.kind,row:+s.id.slice(1)},k)));const got=all.filter(k=>sv.dex[k.c]).length;
app.innerHTML=`<div class="hdr"><span class="pill" onclick="home()" style="cursor:pointer">← 返回</span><span class="pill">📖 已收服 ${got} / ${all.length}</span></div>
<h1 style="font-size:30px">怪兽<b>图鉴</b></h1>
<div class="sec">🌸 平假名</div><div class="dex">${all.filter(k=>k.kind==='h').map(cell).join('')}</div>
<div class="sec">⚡ 片假名</div><div class="dex">${all.filter(k=>k.kind==='k').map(cell).join('')}</div>`}
function cell(k){const g=sv.dex[k.c];return`<div class="dx ${g?'':'no'}" ${g?`onclick="play('${k.a}')"`:''}><img class="px" src="${monImg(k.c,k.kind,k.row)}"><b>${g?k.c:'？'}</b><br>${g?k.r:'???'}</div>`}
// ---------- 解锁 ----------
function fnv(x){let h=0x811c9dc5,h2=0x1234567;for(const c of new TextEncoder().encode('kana1'+x))h=Math.imul(h^c,0x01000193)>>>0;for(const c of new TextEncoder().encode(x+'mon'))h2=Math.imul(h2^c,0x01000193)>>>0;return h.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0')}
function lock(){app.innerHTML=`<h1>解锁<b>全部关卡</b></h1><div class="box center"><div class="big">🔒</div>
<div style="font-size:16px;line-height:1.7;margin-top:6px">平假名 10 关 + 片假名 10 关<br>92 只怪兽 · 50 个 BOSS 单词 · 开口秒杀<br>一次解锁，这台设备永久可玩</div>
<input class="code" id="cd" placeholder="KANA-XXXX-XXXX" autocomplete="off"><div id="msg" class="muted" style="margin-top:8px"></div>
<button class="btn red" onclick="redeem()">解锁 🔑</button></div><button class="btn w" onclick="home()">返回地图</button>`}
function redeem(){const c=$('cd').value.trim().toUpperCase().replace(/\s/g,'');if(HS.includes(fnv(c))){sv.un=true;save();$('msg').textContent='✅ 解锁成功！';SFX.win();setTimeout(home,700)}else{$('msg').textContent='❌ 兑换码不对，请检查后重新输入';SFX.no()}}
home();
</script></body></html>
