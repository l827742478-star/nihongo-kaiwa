<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>在日本过一天</title>
<meta name="description" content="只说日语，在东京活过一天。你的选择会改变剧情，共 5 种结局。">
<style>
:root{--bg:#f8f2e6;--ink:#3b3330;--sub:#8a7f74;--card:#fffdf8;--line:#3b3330;--red:#e8857a;--good:#16a34a;--goodbg:#dcfce7;--mid:#d97706;--midbg:#fef3c7;--bad:#dc2626;--badbg:#fee2e2;--track:#e5e0d5}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.jp{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-weight:700}
.btn{display:block;width:100%;border:3px solid var(--line);background:var(--card);border-radius:18px;padding:13px 16px;font:inherit;font-size:17px;text-align:left;cursor:pointer;box-shadow:0 5px 0 var(--line);margin-top:12px;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn.main{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 5px 0 #cf6c61;text-align:center;font-weight:800;font-size:19px}
.btn.alt{text-align:center;font-weight:800}
.btn .ro{display:block;font-size:13px;color:var(--sub);margin-top:2px}.btn .en{display:block;font-size:13px;color:var(--sub)}
.btn.good{border-color:var(--good);background:var(--goodbg);box-shadow:0 5px 0 var(--good)}
.btn.stiff{border-color:var(--mid);background:var(--midbg);box-shadow:0 5px 0 var(--mid)}
.btn.fail{border-color:var(--bad);background:var(--badbg);box-shadow:0 5px 0 var(--bad)}
.btn.dim{opacity:.35}
.hud{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:2}
.st{flex:1;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 8px;font-weight:800;font-size:15px;text-align:center}
.st small{display:block;font-size:11px;color:var(--sub);font-weight:700}
.bar{height:5px;border-radius:3px;background:var(--track);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-weight:800}
.clock{background:var(--ink);color:#fff;border-radius:30px;padding:5px 12px;font-size:14px}
.place{font-size:14px;color:var(--sub);font-weight:700}.place b{font-size:26px;vertical-align:middle;margin-right:4px}
.npc{margin-top:12px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;position:relative}
.npc .who{font-size:14px;color:var(--sub);font-weight:700}.npc .av{font-size:40px;float:right}
.npc .jp{font-size:23px;margin-top:6px;line-height:1.4}.npc .ro{font-size:14px;color:var(--sub);margin-top:4px}.npc .en{font-size:15px;margin-top:4px}
.hide .npc .jp,.hide .npc .ro,.hide .npc .en,.hide .btn .en{visibility:hidden}
.hide .npc .jp{visibility:visible;color:transparent;text-shadow:0 0 12px rgba(0,0,0,.5);user-select:none}
.play{border:0;background:var(--ink);color:#fff;border-radius:20px;padding:6px 12px;font-size:14px;margin-top:10px;cursor:pointer}
.timer{height:10px;border-radius:5px;background:var(--track);margin-top:14px;overflow:hidden}.timer i{display:block;height:100%;background:var(--red);width:100%}
.res{margin-top:16px;border-radius:18px;padding:16px;border:3px solid}
.res.good{background:var(--goodbg);border-color:var(--good)}.res.stiff{background:var(--midbg);border-color:var(--mid)}.res.fail{background:var(--badbg);border-color:var(--bad)}
.res .tag{font-weight:800;font-size:18px}.res .jp{font-size:18px;margin-top:8px}.res .ex{font-size:15px;margin-top:8px;line-height:1.45}
.chips{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.chips span{background:var(--card);border-radius:20px;padding:3px 10px;font-weight:800;font-size:14px}
h1{font-size:40px;line-height:1.1;margin-top:30px}h1 span{color:var(--red)}
.lead{font-size:17px;margin-top:14px;line-height:1.5}
.card{margin-top:20px;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:22px;text-align:center;box-shadow:0 6px 0 var(--line)}
.em{font-size:64px;line-height:1}.ttl{font-size:26px;font-weight:900;margin-top:8px}
.small{font-size:14px;color:var(--sub);margin-top:10px;line-height:1.5}
.row{display:flex;justify-content:space-between;font-size:15px;padding:6px 0;border-bottom:1px dashed var(--track);text-align:left}
.ends{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.ends div{background:var(--track);border-radius:12px;padding:8px 2px;font-size:24px;text-align:center}.ends div.got{background:#ffe36e}
.lock input{width:100%;border:3px solid var(--line);border-radius:14px;padding:12px;font-size:18px;text-align:center;letter-spacing:1px;margin-top:14px;text-transform:uppercase;font-family:inherit}
.ends small{display:block;font-size:10px;font-weight:700;color:var(--ink);margin-top:2px;line-height:1.2}
</style></head><body><div class="app" id="app"></div>
