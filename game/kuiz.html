<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>听力抢答</title>
<style>
:root{--bg:#f8f2e6;--ink:#3b3330;--sub:#8a7f74;--card:#fffdf8;--line:#3b3330;--brand:#6ea9c8;--brand2:#4f8fb0;--red:#e8857a;--grn:#7fb27a;--yel:#f7d77a;--track:#ece3d3}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;min-height:100vh;user-select:none;-webkit-user-select:none}
.app{max-width:480px;margin:0 auto;padding:10px 16px 24px}
.jp{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif}
rt{font-size:.5em;color:var(--sub)}
a.back{font-size:14px;color:var(--sub);text-decoration:none}
h1{font-size:34px;font-weight:900;margin:18px 0 10px}h1 span{color:var(--brand)}
.lead{font-size:15px;line-height:1.75;margin-bottom:14px}
.box{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px;font-size:14.5px;line-height:1.8}
.go{display:block;width:100%;border:0;border-radius:18px;background:var(--brand);color:#fff;font:inherit;font-size:20px;font-weight:900;padding:16px;box-shadow:0 5px 0 var(--brand2);cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brand2)}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;background:var(--brand);color:#fff;border-radius:14px;padding:9px 14px}
.timer{height:10px;background:var(--track);border-radius:9px;margin:12px 0 4px;overflow:hidden}.timer i{display:block;height:100%;width:100%;background:var(--yel);border-radius:9px}
.stage{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:22px 16px;text-align:center;margin:10px 0 14px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.spk{width:84px;height:84px;border-radius:50%;border:0;background:#dceaf2;font-size:38px;cursor:pointer}
.spk.on{animation:pulse .8s infinite}@keyframes pulse{50%{transform:scale(1.08)}}
.again{font-size:13px;color:var(--sub);border:0;background:none;font:inherit;cursor:pointer;text-decoration:underline}
.ans{font-size:19px;line-height:1.9;font-weight:700}
.opts{display:grid;gap:10px}
.opt{border:3px solid var(--line);border-radius:16px;background:var(--card);font:inherit;font-size:16px;font-weight:700;padding:13px 14px;text-align:left;box-shadow:0 4px 0 var(--line);cursor:pointer;color:var(--ink)}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.opt.ok{background:#dcefd8;border-color:var(--grn);box-shadow:0 4px 0 var(--grn)}.opt.no{background:#fbe2dc;border-color:var(--red);box-shadow:0 4px 0 var(--red)}
.combo{font-size:13px;font-weight:900;color:var(--red);height:18px;text-align:center;margin-top:6px}
.big{font-size:64px;text-align:center;margin-top:18px}.score{text-align:center;font-size:40px;font-weight:900}.score small{font-size:16px;color:var(--sub);display:block;font-weight:700}
.miss{margin:16px 0}.miss h3{font-size:16px;margin-bottom:8px}
.mi{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;border:2px solid var(--track)}
.mi button{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:#dceaf2;font-size:15px;cursor:pointer}
.mi .jp{font-size:16px;font-weight:700;line-height:1.8}.mi small{display:block;color:var(--sub);font-size:13px}
.cr{margin:24px auto 0;padding:12px 14px;border:1.5px dashed #d9cdb8;border-radius:12px;text-align:center;font-size:12px;line-height:1.7;color:var(--sub)}.cr b{display:block;color:#cf6c61;font-size:14px}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style></head><body><div class="app" id="app"></div>
<div class="cr"><b>©️ 已完成数字版权登记 · 侵权必究</b>仅限购买者本人学习使用，禁止转发链接、截图外传、二次售卖</div>
<script src="../data.js"></script>
<script>
const $=id=>document.getElementById(id), app=$('app'), au=new Audio();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=(r,p)=>r?esc(r).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>'):esc(p);
const best=()=>{try{return+localStorage.getItem('kz_best')||0}catch(e){return 0}};
// 题库：听不懂的日语（口语、省略、连读）+ 会话里的句子
const POOL=[];
DATA.forEach(s=>{s.listen.forEach(x=>POOL.push({ja:x.ex,r:x.exR,zh:x.exzh,a:x.a,s}));
  s.dialogues.forEach(d=>d.lines.forEach(l=>{if(l.ja.length>=6&&l.zh.length>=4&&!l.ja.includes('……'))POOL.push({ja:l.ja,r:l.jaR,zh:l.zh,a:l.a,s})}))});
const pick=a=>a[Math.random()*a.length|0];
let q,score,lives,combo,n,miss,tick,t0,lock,next;
function beep(f,d){try{const c=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.value=.07;o.start();o.stop(c.currentTime+d)}catch(e){}}
function make(){const x=pick(POOL),o=new Set([x.zh]);
  while(o.size<4){const y=pick(POOL);if(Math.abs(y.zh.length-x.zh.length)<=8)o.add(y.zh)}
  return{...x,opts:[...o].sort(()=>Math.random()-.5)}}
function start(){app.innerHTML=`<a class="back" href="../">← 返回全部场景</a><h1>听力<span>抢答</span> ⚡</h1>
<p class="lead">听一句日本人说的话，<b>8 秒内</b>选出它的意思。<br>连续答对有连击加分，答错 3 次游戏结束。</p>
<div class="box">🎧 题目来自 100 个场景：会话原句 + 听不懂的日语（省略、连读、口语）<br>🔁 每题可以再听一次<br>📒 结束后，答错的句子会列出来，可以再听</div>
<button class="go" onclick="play()">开始 ⚡</button><p style="text-align:center;margin-top:12px;font-size:13px;color:var(--sub)">🔊 请打开声音 · 最高分 ${best()}</p>`}
function play(){score=0;lives=3;combo=0;n=0;miss=[];next=make();round()}
function hud(){return`<div class="hud"><span>${'❤️'.repeat(lives)}${'🤍'.repeat(3-lives)}</span><span>第 ${n} 题</span><span>⭐ ${score}</span></div>`}
function say(){const s=$('spk');s&&s.classList.add('on');au.src='../audio/'+q.a+'.mp3';au.playbackRate=1;au.play().catch(()=>{});
  au.onended=()=>{s&&s.classList.remove('on');if(!t0)go()}}
function go(){t0=Date.now();clearInterval(tick);tick=setInterval(()=>{const p=1-(Date.now()-t0)/8000,b=$('bar');if(b)b.style.width=Math.max(0,p*100)+'%';if(p<=0)answer(-1)},50)}
function round(){q=next;next=make();new Audio('../audio/'+next.a+'.mp3').preload='auto';n++;lock=false;t0=0;clearInterval(tick);
  app.innerHTML=`${hud()}<div class="timer"><i id="bar"></i></div><div class="stage" id="st"><button class="spk" id="spk">🔊</button><button class="again" id="ag">再听一次</button></div>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div class="combo" id="cb">${combo>1?`🔥 ${combo} 连击`:''}</div>`;
  $('spk').onclick=$('ag').onclick=()=>{au.onended=null;say()};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  const id=n;setTimeout(say,250);setTimeout(()=>{if(n===id&&!t0&&!lock)go()},6000)}
function answer(i){if(lock)return;lock=true;clearInterval(tick);const ok=i>=0&&q.opts[i]===q.zh,bs=document.querySelectorAll('.opt');
  bs.forEach((b,j)=>{if(q.opts[j]===q.zh)b.classList.add('ok');else if(j===i)b.classList.add('no')});
  $('st').innerHTML=`<div class="ans jp">${R(q.r,q.ja)}</div><small style="color:var(--sub)">第 ${+q.s.no} 站 · ${esc(q.s.name)}</small>`;
  if(ok){combo++;const t=Math.max(0,8000-(Date.now()-t0));score+=10+Math.round(t/800)+(combo>2?combo:0);beep(1500,.1);$('cb').textContent=combo>1?`🔥 ${combo} 连击！`:'⭕ 答对了'}
  else{combo=0;lives--;miss.push(q);beep(260,.18);$('st').classList.add('shake');$('cb').textContent=i<0?'⏰ 时间到':'❌ 答错了'}
  au.onended=null;au.src='../audio/'+q.a+'.mp3';au.play().catch(()=>{});
  setTimeout(()=>lives>0?round():end(),ok?1700:2600)}
function end(){clearInterval(tick);const b=Math.max(best(),score);try{localStorage.setItem('kz_best',b)}catch(e){}
  const r=score>=300?['🏆','耳朵已经是日本人了']:score>=150?['👍','听力很稳']:score>=60?['😊','慢慢就能听懂了']:['💪','多听几遍，下次更好'];
  app.innerHTML=`<div class="big">${r[0]}</div><div class="score">${score}<small>${r[1]}　·　答了 ${n} 题　·　最高分 ${b}</small></div>
  ${miss.length?`<div class="miss"><h3>这几句没听出来，再听听</h3>${miss.map((m,i)=>`<div class="mi"><button data-a="${m.a}">▶</button><div><div class="jp">${R(m.r,m.ja)}</div><small>${esc(m.zh)}　·　第 ${+m.s.no} 站</small></div></div>`).join('')}</div>`:''}
  <button class="go" onclick="play()">再来一局 🔁</button><p style="text-align:center;margin-top:14px"><a class="back" href="../">← 返回全部场景</a></p>`;
  document.querySelectorAll('.mi button').forEach(b=>b.onclick=()=>{au.onended=null;au.src='../audio/'+b.dataset.a+'.mp3';au.play().catch(()=>{})});scrollTo(0,0)}
start();
</script></body></html>
